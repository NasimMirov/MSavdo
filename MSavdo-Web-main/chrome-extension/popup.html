<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>M.Savdo — импорт товаров</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background: #0c0d10;
      color: #fff;
      font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px;
      resize: vertical;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      background: #18181b;
      color: #fff;
      font: inherit;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: #facc15;
      color: #18181b;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin: 10px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    #status:empty { display: none; }
    .error { color: #fca5a5; }
    .success { color: #86efac; }
  </style>
</head>
<body>
  <label for="page-code">Код страницы (необязательно)</label>
  <textarea id="page-code" placeholder="Вставьте HTML или window.context. Если поле пустое, данные будут прочитаны с текущей страницы."></textarea>
  <button id="import" type="button">Импортировать товар</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
